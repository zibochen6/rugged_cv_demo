# Runtime configuration for the rear-view depth warning app.
# This is the NX-adapted version of the master spec's config (§42):
# platform = Orin NX / JP5.1.3 / Py3.8 / TRT 8.5.2, camera = RTSP PoE.

pipeline:
  scale: 0.5                 # perception chain resolution scale (perf)
  max_fps: 12.5              # rear stays >=10 FPS without monopolising the module
  depth_fps: 10.0            # actual GPU depth cadence; latest frame only

system:
  backend: tensorrt            # pytorch | tensorrt  (tensorrt falls back to pytorch)
  device: cuda
  debug: false

camera:
  rtsp_url: ""                 # rear camera comes from REAR_CAMERA_URL / --camera
  width: 2304
  height: 1296
  fps: 20
  flip: false
  calibrated: false            # intrinsics below ignored while false (60-deg hFOV estimate)
  intrinsics:                  # fill after chessboard calibration
    fx: 0.0
    fy: 0.0
    cx: 0.0
    cy: 0.0
  distortion:
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
    k3: 0.0
  depth_calibration:           # tape-measure fit D_corrected = raw*scale + offset
    enabled: false
    scale: 1.0
    offset: 0.0

model:
  checkpoint: checkpoints/depth_anything_v2_metric_indoor_small
  onnx: models/onnx/depth_metric_small_518.onnx
  engine: models/tensorrt/depth_metric_small_518_fp16.engine
  input_longest_edge: 518     # ladder: 518 -> 448 -> 392 (benchmark decides)
  dtype: fp16

depth:
  min_depth_m: 0.3
  max_depth_m: 10.0
  spatial_filter:
    enabled: true
    kernel: 3
  temporal_filter:
    enabled: true
    alpha: 0.25

camera_mount:
  height_m: 1.5
  pitch_deg: 25.0
  roll_deg: 0.0
  yaw_deg: 0.0

danger_roi:
  normalized_points: [[0.20, 1.0], [0.80, 1.0], [0.63, 0.42], [0.37, 0.42]]

collision_corridor:            # physical BEV corridor (§16) - MVP disabled
  enabled: false
  width_m: 1.8
  max_distance_m: 6.0

ground_filter:
  enabled: true
  method: expected_depth
  tolerance_ratio: 0.20
  min_height_px: 5

obstacle:
  min_area_px: 200
  morphology: true
  min_frames: 3

distance:
  method: percentile
  percentile: 10

temporal:
  ema_alpha: 0.25
  history_frames: 5
  trigger_frames: 3

ttc:
  enabled: true
  min_closing_speed_mps: 0.10

velocity:
  window_frames: 10

warning:
  warning_distance_m: 3.0
  danger_distance_m: 1.5
  warning_ttc_s: 3.0
  danger_ttc_s: 1.5
  hysteresis:
    exit_margin_m: 0.3
    exit_ttc_s: 0.5

person:
  enabled: true
  required: true
  engine: models/tensorrt/yolov8n_person_fp16.engine
  confidence: 0.45
  iou: 0.50
  input_size: 640
  warning_distance_m: 4.0
  danger_distance_m: 2.0
  max_result_age_s: 0.5
  max_frame_skew: 4
  max_fps: 5.0               # actual person-detector cadence; latest frame only

watchdog:
  max_consecutive_bad_frames: 3
  camera_lost_timeout_s: 5.0

logger:
  enabled: true
  dir: logs

events:
  min_interval_s: 2.0
  dir: logs

io:
  alarm_mode: serial             # none | bell | gpio | serial
  alarm_gpio_cmd: "gpioset 1 3=1"
  alarm_serial_port: /dev/serial/by-id/usb-1a86_5523-if00-port0
  alarm_serial_baud: 9600
  alarm_serial_buzzer: false   # true=红灯闪烁+蜂鸣, false=只闪红灯(静音)
